[project]
name = "browserpilot"
version = "0.1.0"
description = "Autonomous browser agent with Playwright and OpenAI-compatible tool calling"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.107.0",
  "playwright>=1.55.0",
  "pydantic-settings>=2.10.1",
]

[project.scripts]
browserpilot = "browserpilot.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
